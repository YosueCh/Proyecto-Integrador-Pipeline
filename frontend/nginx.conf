server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker resuelve el nombre del servicio "backend"; con variable, nginx arranca aunque el backend aun no exista
  resolver 127.0.0.11 valid=10s;

  # La API vive en el contenedor backend; se reenvian tambien los encabezados traceparent (OpenTelemetry)
  location /api/ {
    set $backend http://backend:80;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /nginx-health {
    access_log off;
    return 200 'ok';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
